<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hũ tiết kiệm · 8.415.000 ₫</title>
<style>
  :root{
    --ink:#123329; --ink-soft:#5c6f66; --muted:#8a7a5e;
    --paper:#f4efe4; --card:#fffdf7; --line:#e6dcc8;
    --gold:#e2a93b; --gold-deep:#a9741f;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0;padding:clamp(16px,4vw,48px);
    min-height:100vh;display:grid;place-items:center;
    font:16px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 10% -10%, #fffaf0, transparent 65%),
      radial-gradient(800px 600px at 110% 120%, #e8efe4, transparent 60%),
      var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  .card{
    width:min(940px,100%);display:grid;grid-template-columns:1.05fr .95fr;
    background:var(--card);border:1px solid var(--line);border-radius:30px;overflow:hidden;
    box-shadow:0 40px 80px -50px #14332b66, inset 0 2px 0 #fff;
    transition:border-color .4s;
  }
  .card.done{border-color:#e0b45c}

  /* ---------- jar stage ---------- */
  .stage{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:40px 24px 34px;
    background:radial-gradient(90% 70% at 50% 8%, #22594a 0%, #143a30 55%, #0f2b24 100%);
    transition:background .5s;
  }
  .stage::after{
    content:"";position:absolute;left:50%;bottom:16%;width:220px;height:64px;
    translate:-50% 0;border-radius:50%;filter:blur(8px);opacity:.4;
    background:radial-gradient(closest-side,#000,transparent);
  }
  .jar{
    position:relative;z-index:1;display:block;width:min(246px,74%);height:auto;
    filter:drop-shadow(0 26px 30px rgba(0,0,0,.4));
    transition:filter .5s;
  }
  .card.done .stage{background:radial-gradient(90% 70% at 50% 8%, #2f6b54 0%, #17453a 55%, #0f2b24 100%)}
  .card.done .jar{filter:drop-shadow(0 0 30px #e2a93b99) drop-shadow(0 26px 30px rgba(0,0,0,.4));animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{50%{transform:scale(1.045)}}

  .pct{
    position:relative;z-index:1;padding:6px 14px;border-radius:999px;
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:#ecd9a4;background:#ffffff12;border:1px solid #ffffff1f;
    font-variant-numeric:tabular-nums;
  }
  .stamp{
    display:none;position:absolute;z-index:2;top:22px;right:22px;rotate:7deg;
    padding:6px 12px;border:2px solid #f0c463;border-radius:8px;
    color:#f7dc96;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  }
  .card.done .stamp{display:block;animation:stamp .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes stamp{from{opacity:0;scale:1.5}}

  .coin-drop{
    position:absolute;left:50%;top:28%;z-index:3;
    padding:8px 15px;border-radius:999px;font-size:14px;font-weight:700;
    color:#3a2505;background:linear-gradient(#ffe29a,#e4ad43);
    box-shadow:0 10px 20px -8px #000b, inset 0 1px 0 #fff8;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    animation:drop .95s cubic-bezier(.35,.7,.4,1) forwards;
  }
  @keyframes drop{
    0%{transform:translate(-50%,-50px) scale(.6);opacity:0}
    25%{transform:translate(-50%,0) scale(1);opacity:1}
    72%{transform:translate(-50%,150px) scale(.92);opacity:1}
    100%{transform:translate(-50%,195px) scale(.3);opacity:0}
  }

  /* ---------- panel ---------- */
  .panel{padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px}
  .eyebrow{
    margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);
  }
  .amount{
    margin:0;display:flex;align-items:baseline;gap:8px;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:clamp(2.5rem,6vw,3.5rem);line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .unit{font-size:.4em;color:var(--muted)}
  .sub{margin:-4px 0 6px;font-size:15px;color:var(--ink-soft);min-height:22px}
  .sub b{color:var(--ink);font-variant-numeric:tabular-nums}

  .add{display:flex;gap:10px;flex-wrap:wrap}
  .add input{
    flex:1 1 150px;min-width:0;padding:14px 16px;border-radius:14px;
    border:1px solid #e0d7c2;background:#fbf7ee;font:inherit;font-size:16px;color:inherit;
    font-variant-numeric:tabular-nums;outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .add input::placeholder{color:#b6ac95}
  .add input:focus{border-color:#c9a253;box-shadow:0 0 0 4px #e2a93b24}
  .add input.bad{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .add button{
    padding:14px 22px;border:0;border-radius:14px;cursor:pointer;
    font:inherit;font-weight:600;color:#22160a;
    background:linear-gradient(180deg,#f3c765,#dfa23a);
    box-shadow:0 12px 22px -14px #a9741f, inset 0 1px 0 #fff6;
    transition:filter .2s, transform .12s;
  }
  .add button:hover{filter:brightness(1.06)}
  .add button:active{transform:translateY(1px)}

  .foot{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
    margin-top:4px;padding-top:16px;border-top:1px dashed var(--line);
    font-size:13px;color:#7d8a82;
  }
  .foot b{color:var(--ink);font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:14px}
  .link{
    background:none;border:0;padding:0;font:inherit;font-size:13px;cursor:pointer;
    color:var(--muted);text-decoration:underline;text-underline-offset:3px;
  }
  .link:disabled{opacity:.4;cursor:default;text-decoration:none}

  @media (max-width:720px){
    .card{grid-template-columns:1fr}
    .stage{min-height:340px;padding:30px 20px 26px}
    .jar{width:min(210px,62%)}
    .panel{padding:26px 22px 30px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<main class="card" id="card">
  <section class="stage" id="stage">
    <div class="stamp" aria-hidden="true">Hoàn thành</div>
    <svg class="jar" viewBox="0 0 260 360" aria-hidden="true">
      <defs>
        <clipPath id="jarClip">
          <path d="M60 52 H200 V66 C200 94 228 104 228 138 V296 C228 314 214 326 196 326 H64 C46 326 32 314 32 296 V138 C32 104 60 94 60 66 Z"/>
        </clipPath>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f8d883"/>
          <stop offset=".45" stop-color="#e6b14c"/>
          <stop offset="1" stop-color="#bd8127"/>
        </linearGradient>
        <radialGradient id="coinGrad" cx=".35" cy=".3" r=".85">
          <stop offset="0" stop-color="#ffeda9"/>
          <stop offset="1" stop-color="#cf962d"/>
        </radialGradient>
        <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
          <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
        </linearGradient>
      </defs>

      <!-- glass body -->
      <path d="M60 52 H200 V66 C200 94 228 104 228 138 V296 C228 314 214 326 196 326 H64 C46 326 32 314 32 296 V138 C32 104 60 94 60 66 Z"
            fill="url(#glassGrad)"/>

      <!-- money + surface coins, clipped to the jar -->
      <g clip-path="url(#jarClip)">
        <g id="money" transform="translate(0 326)" style="transition:transform .9s cubic-bezier(.22,1,.36,1)">
          <rect x="16" y="0" width="228" height="360" fill="url(#goldGrad)"/>
          <g id="coins">
            <ellipse cx="130" cy="0" rx="104" ry="9.5" fill="#fbe3a1" opacity=".85"/>
            <g fill="url(#coinGrad)" stroke="#a9741f" stroke-width="1.6">
              <circle cx="80" cy="-3" r="11.5"/>
              <circle cx="116" cy="-7" r="9"/>
              <circle cx="150" cy="-2" r="12"/>
              <circle cx="184" cy="-6" r="8.5"/>
            </g>
          </g>
        </g>

        <!-- glass shine -->
        <path d="M52 150 C45 202 45 252 54 294" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="9" stroke-linecap="round"/>
        <rect x="82" y="100" width="14" height="150" rx="7" fill="#fff" opacity=".07"/>
      </g>

      <!-- rim -->
      <path d="M60 52 H200 V66 C200 94 228 104 228 138 V296 C228 314 214 326 196 326 H64 C46 326 32 314 32 296 V138 C32 104 60 94 60 66 Z"
            fill="none" stroke="#cfe6da" stroke-opacity=".45" stroke-width="2.5"/>

      <!-- lid -->
      <rect x="48" y="28" width="164" height="30" rx="15" fill="#0f2b24" stroke="#0a1f19" stroke-width="2"/>
      <rect x="110" y="41" width="40" height="5" rx="2.5" fill="#2a4b40"/>
      <rect x="56" y="31" width="90" height="4" rx="2" fill="#fff" opacity=".08"/>
    </svg>
    <div class="pct" id="pct">0% đầy hũ</div>
  </section>

  <section class="panel">
    <p class="eyebrow">Hũ tiết kiệm</p>
    <h1 class="amount"><span id="savedText">0</span><span class="unit">₫</span></h1>
    <p class="sub" id="status" aria-live="polite"></p>

    <form class="add" id="addForm" autocomplete="off">
      <label class="sr" for="amount">Số tiền muốn bỏ vào hũ</label>
      <input id="amount" name="amount" inputmode="numeric" placeholder="200.000" maxlength="15">
      <button type="submit">Bỏ vào hũ</button>
    </form>

    <div class="foot">
      <span>Mục tiêu <b>8.415.000 ₫</b></span>
      <span class="actions">
        <button class="link" id="undo" type="button" disabled>Hoàn tác</button>
        <button class="link" id="reset" type="button">Đặt lại hũ</button>
      </span>
    </div>
  </section>
</main>

<script>
  const GOAL = 8415000;
  const KEY = 'hu-tien-v1';
  const FILL_TOP = 62, FILL_BOTTOM = 326;
  const $ = id => document.getElementById(id);
  let saved = 0, last = 0;

  try {
    const d = JSON.parse(localStorage.getItem(KEY) || '{}');
    saved = Math.min(GOAL, Math.max(0, Number(d.saved) || 0));
    last = Math.max(0, Number(d.last) || 0);
  } catch (e) {}

  const fmt = n => n.toLocaleString('vi-VN');
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ saved, last })); } catch (e) {} };

  function render() {
    const p = Math.min(1, saved / GOAL);
    $('money').style.transform = `translateY(${(FILL_BOTTOM - p * (FILL_BOTTOM - FILL_TOP)).toFixed(2)}px)`;
    $('coins').style.opacity = saved > 0 ? 1 : 0;
    $('savedText').textContent = fmt(saved);
    $('pct').textContent = Math.round(p * 100) + '% đầy hũ';
    $('card').classList.toggle('done', saved >= GOAL);
    $('addForm').hidden = saved >= GOAL;
    $('undo').disabled = !last;
    $('status').innerHTML = saved >= GOAL
      ? 'Hũ đã đầy — <b>hoàn thành mục tiêu!</b> 🎉'
      : `Còn <b>${fmt(GOAL - saved)} ₫</b> nữa để đầy hũ`;
  }

  function dropCoin(v) {
    const el = document.createElement('div');
    el.className = 'coin-drop';
    el.textContent = '+' + fmt(v);
    $('stage').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('amount');
    const v = Number(input.value.replace(/\D/g, ''));
    if (!v) {
      input.classList.remove('bad');
      void input.offsetWidth;
      input.classList.add('bad');
      input.focus();
      return;
    }
    const add = Math.min(v, GOAL - saved);
    saved += add;
    last = add;
    input.value = '';
    input.classList.remove('bad');
    save();
    render();
    dropCoin(add);
  });

  $('undo').addEventListener('click', () => {
    saved = Math.max(0, saved - last);
    last = 0;
    save();
    render();
  });

  $('reset').addEventListener('click', () => {
    if (!confirm('Đặt lại hũ về 0? Toàn bộ tiến độ đã lưu sẽ mất.')) return;
    saved = 0;
    last = 0;
    save();
    render();
  });

  render();
</script>
</body>
</html>
