<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hũ tiền · Tiết kiệm & Tết 2027</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23EAFBF3'/%3E%3Cg fill='%234FC49A'%3E%3Ccircle cx='16' cy='10.2' r='5.4'/%3E%3Ccircle cx='9.4' cy='18.8' r='5.4'/%3E%3Ccircle cx='22.6' cy='18.8' r='5.4'/%3E%3C/g%3E%3Cpath d='M16 18c0 4.5.8 7.5 3 10' stroke='%232F9F78' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5A3B4C; --ink-soft:#8A6C7B; --muted:#B08A99;
    --card:#FFFDFB; --pink:#FF7EA5; --pink-deep:#F0567F;
    --gold:#FFC94D; --mint:#6FD8BE;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  ::selection{background:#FFD3E0}
  body{
    margin:0;padding:clamp(18px,4vw,52px);
    min-height:100vh;display:grid;place-items:center;
    font:16px/1.55 "Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(rgba(255,182,203,.45) 1.1px, transparent 1.4px) 0 0/26px 26px,
      radial-gradient(720px 520px at 8% -6%, #FFE3EB 0%, transparent 62%),
      radial-gradient(680px 520px at 102% -4%, #DDEBFF 0%, transparent 60%),
      radial-gradient(760px 620px at 56% 116%, #DCF6EC 0%, transparent 62%),
      radial-gradient(640px 520px at 0% 100%, #FFF2CC 0%, transparent 60%),
      #FFF9F4;
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  /* ---------- shell ---------- */
  .card{
    width:min(960px,100%);display:grid;grid-template-columns:1.02fr .98fr;
    border-radius:38px;overflow:hidden;background:var(--card);
    border:1px solid #FFE4D8;
    box-shadow:0 26px 60px -34px rgba(214,112,144,.42), 0 10px 24px -18px rgba(255,178,122,.4);
  }
  .card.done{
    border-color:#FFD98A;
    box-shadow:0 30px 70px -34px rgba(255,170,60,.55), 0 10px 24px -18px rgba(255,140,170,.4);
  }

  /* ---------- jar stage ---------- */
  .stage{
    position:relative;isolation:isolate;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;padding:44px 24px 36px;
    background:
      radial-gradient(58% 44% at 50% 82%, rgba(255,213,140,.6), transparent 72%),
      radial-gradient(54% 46% at 4% 0%, rgba(255,203,222,.72), transparent 70%),
      radial-gradient(50% 44% at 102% 102%, rgba(203,235,255,.78), transparent 70%),
      linear-gradient(160deg,#FFF9F2,#FFF0F5 55%,#F4F2FF);
  }
  .card.done .stage{
    background:
      radial-gradient(58% 46% at 50% 80%, rgba(255,206,114,.85), transparent 72%),
      radial-gradient(54% 46% at 4% 0%, rgba(255,205,222,.8), transparent 70%),
      radial-gradient(50% 44% at 102% 102%, rgba(208,240,255,.85), transparent 70%),
      linear-gradient(160deg,#FFF9ED,#FFF1E4 55%,#FFF3F7);
  }
  .stage::after{
    content:"";position:absolute;left:50%;bottom:14%;z-index:0;
    width:248px;height:54px;translate:-50% 0;border-radius:50%;filter:blur(5px);
    background:radial-gradient(closest-side,rgba(214,112,144,.26),transparent);
  }
  .doodles{position:absolute;inset:0;z-index:0;pointer-events:none}
  .doodles span{
    position:absolute;font-size:22px;line-height:1;
    animation:floaty 5.5s ease-in-out infinite;
  }
  .doodles span:nth-child(1){top:13%;left:13%;color:#FFB3C7;font-size:26px}
  .doodles span:nth-child(2){top:9%;right:15%;color:#FFD37E;font-size:22px;animation-delay:.8s}
  .doodles span:nth-child(3){bottom:29%;left:10%;color:#9FE6D3;font-size:20px;animation-delay:1.6s}
  .doodles span:nth-child(4){bottom:20%;right:11%;color:#CFC2FF;font-size:24px;animation-delay:2.2s}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}

  .jar{
    position:relative;z-index:1;display:block;width:min(264px,76%);height:auto;
    filter:drop-shadow(0 22px 22px rgba(214,112,144,.3));
    transition:filter .5s;
  }
  .card.done .jar{
    filter:drop-shadow(0 0 26px rgba(255,190,80,.8)) drop-shadow(0 22px 22px rgba(214,112,144,.3));
    animation:pop .7s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{50%{transform:scale(1.045)}}

  .face-happy{display:none}
  .card.done .face-idle{display:none}
  .card.done .face-happy{display:block}

  .stamp{
    display:none;position:absolute;z-index:3;top:22px;right:22px;rotate:7deg;
    padding:7px 13px;border-radius:11px;
    background:linear-gradient(135deg,#FF9DBB,#F0567F);color:#fff;
    border:2px dashed rgba(255,255,255,.8);
    box-shadow:0 12px 22px -12px #F0567F;
    font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  }
  .card.done .stamp{display:block;animation:stamp .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes stamp{from{opacity:0;scale:1.5}}

  .sparkles{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s}
  .card.done .sparkles{opacity:1}
  .sparkles i{
    position:absolute;width:7px;height:7px;border-radius:50%;
    background:#FF8FB1;color:#FF8FB1;box-shadow:0 0 12px currentColor;
    animation:twinkle 2.6s ease-in-out infinite;
  }
  .sparkles i:nth-child(1){top:15%;left:14%}
  .sparkles i:nth-child(2){top:25%;right:19%;width:5px;height:5px;background:#FFC94D;color:#FFC94D;animation-delay:.6s}
  .sparkles i:nth-child(3){bottom:31%;left:12%;width:5px;height:5px;background:#6FD8BE;color:#6FD8BE;animation-delay:1.1s}
  .sparkles i:nth-child(4){top:46%;right:9%;width:5px;height:5px;background:#B9A6FF;color:#B9A6FF;animation-delay:1.6s}
  .sparkles i:nth-child(5){bottom:17%;right:27%;width:4px;height:4px;animation-delay:2s}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

  .coin-drop{
    position:absolute;left:50%;top:26%;z-index:4;
    padding:8px 15px;border-radius:999px;font-size:14px;font-weight:800;
    color:#5A3B1A;background:linear-gradient(135deg,#FFE9A8,#FFC24D);
    box-shadow:0 12px 22px -10px rgba(214,140,40,.7), inset 0 1px 0 #fff8;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    animation:drop .95s cubic-bezier(.35,.7,.4,1) forwards;
  }
  @keyframes drop{
    0%{transform:translate(-50%,-50px) scale(.6);opacity:0}
    25%{transform:translate(-50%,0) scale(1);opacity:1}
    72%{transform:translate(-50%,152px) scale(.92);opacity:1}
    100%{transform:translate(-50%,196px) scale(.3);opacity:0}
  }

  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;position:relative;z-index:1}
  .pct{
    padding:6px 14px;border-radius:999px;background:#fff;
    font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  #pct{color:#129A80;border:1.5px solid #BFF0E2;box-shadow:0 8px 16px -12px #5FD6BC}
  #daypill{color:#E0668B;border:1.5px solid #FFD3DF;box-shadow:0 8px 16px -12px #FF9DB8}

  /* ---------- panel ---------- */
  .panel{
    padding:clamp(28px,4vw,46px);display:flex;flex-direction:column;justify-content:center;gap:17px;
    background:
      radial-gradient(110% 75% at 100% 0%, rgba(255,214,228,.4), transparent 62%),
      radial-gradient(95% 65% at 0% 100%, rgba(214,246,236,.45), transparent 62%);
  }
  .brand{display:flex;align-items:center;gap:9px}
  .logo{
    flex:none;width:31px;height:31px;display:grid;place-items:center;border-radius:11px;
    background:linear-gradient(135deg,#EAFBF3,#D3F4E5);border:1.5px solid #BEEEDC;
    box-shadow:0 8px 16px -12px #4EC59B;
  }
  .logo svg{width:20px;height:20px;display:block}
  .brand-name{font-family:"Baloo 2","Nunito",sans-serif;font-size:16.5px;font-weight:800;line-height:1;color:var(--ink)}
  .brand-name small{display:block;margin-top:3px;font-family:"Nunito","Segoe UI",sans-serif;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#C4A3B0}

  .tabs{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;
    background:#FFF0F4;border:1px solid #FFE0E8;border-radius:17px;
  }
  .tab{
    border:0;background:none;padding:10px 6px;border-radius:13px;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:800;color:#B08A99;
    transition:background .22s,color .22s,box-shadow .22s;
  }
  .tab:hover{color:#F0567F}
  .tab[aria-pressed="true"]{
    background:linear-gradient(135deg,#FF9DBB,#FF6E9B);color:#fff;
    box-shadow:0 12px 20px -12px #FF7EA5;
  }
  .tab[data-jar="tet"][aria-pressed="true"]{
    background:linear-gradient(135deg,#FFD37E,#FFA93F);color:#5A3B1A;
    box-shadow:0 12px 20px -12px #FFB04A;
  }
  .tab:focus-visible,.link:focus-visible,.add button:focus-visible{outline:2px solid #FF9DBB;outline-offset:2px}

  .amount{
    margin:0;display:flex;align-items:baseline;gap:9px;
    font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;
    font-weight:800;font-size:clamp(2.6rem,6.2vw,3.6rem);line-height:1.05;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);
  }
  .unit{font-size:.4em;font-weight:800;color:var(--pink)}
  .sub{margin:-2px 0 4px;font-size:15px;color:var(--ink-soft);min-height:22px;line-height:1.45}
  .sub b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}

  .add{display:flex;gap:10px;flex-wrap:wrap}
  .add input{
    flex:1 1 150px;min-width:0;padding:15px 16px;border-radius:16px;
    border:1.5px solid #FFDCE6;background:#FFF7FA;
    font:inherit;font-weight:600;font-size:16px;color:inherit;font-variant-numeric:tabular-nums;outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .add input::placeholder{color:#D2B2BE;font-weight:600}
  .add input:focus{border-color:#FFA9C4;background:#fff;box-shadow:0 0 0 4px rgba(255,126,165,.16)}
  .add input.bad{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
  .add button{
    padding:15px 22px;border:0;border-radius:16px;cursor:pointer;
    font:inherit;font-size:15px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#FFA2BF,#FF6E9B);
    box-shadow:0 14px 24px -12px rgba(255,110,155,.65), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s, filter .2s, box-shadow .2s;
  }
  .add button:hover{filter:brightness(1.04);box-shadow:0 18px 28px -12px rgba(255,110,155,.7), inset 0 1px 0 #fff8}
  .add button:active{transform:translateY(1px)}

  .quick{display:flex;gap:7px;flex-wrap:wrap}
  .quick button{
    flex:1 1 0;min-width:62px;padding:9px 6px;border-radius:12px;cursor:pointer;
    border:1.5px solid #FFDCE6;background:#fff;color:#E0668B;
    font:inherit;font-size:12.5px;font-weight:800;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .quick button:hover{background:#FFF0F4;border-color:#FFB3C7}
  .quick button:active{transform:translateY(1px)}
  .quick button:focus-visible,.date-row input:focus-visible{outline:2px solid #FF9DBB;outline-offset:2px}

  .date-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:#A08594}
  .date-row input{
    padding:7px 9px;border-radius:11px;border:1.5px solid #FFDCE6;background:#FFF7FA;
    font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);outline:none;
    font-variant-numeric:tabular-nums;
  }
  .date-row .hint{font-size:11.5px;font-weight:600;color:#C0A3AF}

  .foot{
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
    margin-top:2px;padding-top:16px;border-top:1.5px dashed #FFE0D3;
    font-size:12.5px;font-weight:600;color:#A08594;
  }
  .foot b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .goal-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .goal-edit{display:flex;align-items:center;gap:8px}
  .goal-edit input{
    width:112px;padding:6px 9px;border-radius:9px;border:1.5px solid #FFDCE6;background:#fff;
    font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);outline:none;
    font-variant-numeric:tabular-nums;
  }
  .goal-edit input:focus{border-color:#FFA9C4;box-shadow:0 0 0 3px rgba(255,126,165,.16)}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  .reset-confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:#C2405A}
  .link{
    background:none;border:0;padding:0;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    color:#B08495;text-decoration:underline;text-underline-offset:3px;
  }
  .link:hover{color:var(--pink-deep)}
  .link:disabled{opacity:.4;cursor:default;text-decoration:none}

  /* ---------- ledger ---------- */
  .ledger{
    grid-column:1/-1;padding:clamp(20px,3vw,28px) clamp(22px,4vw,46px) clamp(22px,3vw,32px);
    border-top:1.5px dashed #FFE0D3;
    background:
      radial-gradient(80% 130% at 50% 0%, rgba(255,224,234,.4), transparent 64%),
      radial-gradient(70% 130% at 100% 100%, rgba(214,246,236,.45), transparent 64%);
  }
  .ledger-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin-bottom:12px}
  .ledger h2{margin:0;font-size:14.5px;font-weight:800;color:var(--ink)}
  .ledger h2 span{color:var(--pink)}
  .today-sum{margin:0;font-size:13px;font-weight:700;color:#A08594}
  .today-sum b{color:#0F9C80;font-weight:800;font-variant-numeric:tabular-nums}

  .table-wrap{max-height:320px;overflow:auto;border-radius:18px;border:1.5px solid #FFE7EE;background:#fff;overscroll-behavior:contain}
  .table-wrap table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  .table-wrap thead th{
    position:sticky;top:0;z-index:2;background:#FFF4F7;padding:9px 14px;
    font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#B08495;text-align:left;
  }
  .table-wrap thead th:nth-child(2){text-align:right}
  .table-wrap tbody td{padding:10px 14px;border-top:1px solid #FFF0F4;color:var(--ink-soft)}
  .table-wrap tbody td.amt{text-align:right;font-weight:800;color:var(--ink);white-space:nowrap;padding-left:0}
  .table-wrap tbody tr.today td{background:#F4FCF9}
  .table-wrap tbody tr.today td.amt{color:#0F9C80}
  .table-wrap tbody td.row-actions{width:1%;white-space:nowrap;text-align:right;padding:5px 10px 5px 0}
  .mini{
    border:1.5px solid #FFDCE6;background:#fff;color:#A87F90;
    padding:4px 10px;border-radius:999px;cursor:pointer;
    font:inherit;font-size:11px;font-weight:800;line-height:1.5;
    transition:background .18s,border-color .18s,color .18s;
  }
  .mini:hover{background:#FFF6F9;border-color:#FFB3C7;color:#E0668B}
  .mini:focus-visible{outline:2px solid #FF9DBB;outline-offset:2px}
  .mini.primary{background:linear-gradient(135deg,#FFA2BF,#FF6E9B);border-color:transparent;color:#fff;box-shadow:0 8px 14px -10px #FF7EA5}
  .mini.primary:hover{filter:brightness(1.04);color:#fff}
  .mini.danger{color:#D0344B;border-color:#FFCFCF}
  .mini.danger:hover{background:#FFF4F4;border-color:#FFAFAF;color:#C02740}
  .row-actions .mini + .mini{margin-left:4px}
  .row-input{
    width:120px;max-width:100%;padding:5px 9px;border-radius:9px;border:1.5px solid #FFA9C4;background:#fff;
    font:inherit;font-size:13px;font-weight:800;color:var(--ink);text-align:right;outline:none;
    font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px rgba(255,126,165,.14);
  }
  .row-input.bad{animation:shake .35s}
  .edit-row td{background:#FFFAFC}
  .del-row td{background:#FFF6F7}
  .del-warn{color:#D0344B;font-weight:700}
  .d-day{font-weight:800;color:var(--ink)}
  .d-wd{margin-left:7px;font-size:12px;font-weight:600;color:#BE9FAC}
  .d-chip{
    display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
    font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#0F9C80;background:#E3FBF3;border:1px solid #BDEFE2;
  }
  .month-row td{
    padding:8px 14px;background:#FFFAFB;border-top:1px solid #FFE7EE;
    font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#C79AAC;
    text-align:left;
  }
  .table-wrap tbody .month-row td{text-align:left;font-weight:800;color:#C79AAC}
  .log-empty{margin:0;padding:20px 16px;text-align:center;font-size:13px;font-weight:600;color:#BE9FAC}

  /* ---------- insights ---------- */
  .insights{display:grid;grid-template-columns:150px 1fr;gap:12px 20px;align-items:end;margin-bottom:14px}
  .months{display:flex;align-items:flex-end;gap:6px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .track{width:100%;height:38px;border-radius:5px;background:#FFF3F6;display:flex;align-items:flex-end;overflow:hidden}
  .bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#FFC2D3,#FF8FB1)}
  .bar span{font-size:9.5px;font-weight:800;color:#C0A3AF}
  .chart-cap{margin:7px 0 0;font-size:11.5px;font-weight:700;color:#A08594}
  .chart-cap b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .insight-lines p{margin:0;font-size:12.5px;font-weight:600;line-height:1.5;color:#A08594}
  .insight-lines p + p{margin-top:3px}
  .insight-lines b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  #streak b{color:#E0668B}
  #pace b{color:#0F9C80}
  .insights.solo{grid-template-columns:1fr}

  @media (max-width:720px){
    .card{grid-template-columns:1fr;border-radius:32px}
    .ledger{padding:20px 18px 24px}
    .insights{grid-template-columns:1fr;align-items:start;gap:12px}
    .chart{max-width:184px}
    .table-wrap{max-height:238px}
    .table-wrap thead th,.table-wrap tbody td{padding:9px 12px}
    .table-wrap thead th:nth-child(2),.table-wrap tbody td.amt{text-align:right}
    .stage{min-height:346px;padding:32px 20px 28px}
    .jar{width:min(214px,64%)}
    .panel{padding:26px 22px 30px}
    .amount{font-size:clamp(2.35rem,9vw,3rem)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }

</style>
</head>
<body>
<main class="card" id="card">
  <section class="stage" id="stage">
    <div class="stamp" aria-hidden="true">Hoàn thành</div>
    <div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="doodles" aria-hidden="true"><span>♡</span><span>✦</span><span>✿</span><span>♡</span></div>
    <svg class="jar" viewBox="0 0 260 360" aria-hidden="true">
      <defs>
        <clipPath id="jarClip">
          <path d="M60 52 H200 V66 C200 94 228 104 228 138 V296 C228 314 214 326 196 326 H64 C46 326 32 314 32 296 V138 C32 104 60 94 60 66 Z"/>
        </clipPath>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFEDB2"/>
          <stop offset=".42" stop-color="#FFC85A"/>
          <stop offset="1" stop-color="#EFA23C"/>
        </linearGradient>
        <radialGradient id="coinGrad" cx=".35" cy=".3" r=".85">
          <stop offset="0" stop-color="#FFF6CE"/>
          <stop offset="1" stop-color="#F0A83C"/>
        </radialGradient>

      <path d="M130 51 C124 46 121 43 123 40.5 C125 38 129 38.5 130 41 C131 38.5 135 38 137 40.5 C139 43 136 46 130 51 Z" fill="#FF8FB1"/>
      <rect x="56" y="31" width="90" height="4" rx="2" fill="#fff" opacity=".5"/>

          <g fill="url(#cloverGrad)">
            <path d="M16 16 C10.5 16 7.2 12.2 9.2 8.6 C11.2 5.2 14.6 6.2 16 9.2 C17.4 6.2 20.8 5.2 22.8 8.6 C24.8 12.2 21.5 16 16 16 Z"/>
            <path d="M16 16 C10.5 16 7.2 12.2 9.2 8.6 C11.2 5.2 14.6 6.2 16 9.2 C17.4 6.2 20.8 5.2 22.8 8.6 C24.8 12.2 21.5 16 16 16 Z" transform="rotate(120 16 16)"/>
            <path d="M16 16 C10.5 16 7.2 12.2 9.2 8.6 C11.2 5.2 14.6 6.2 16 9.2 C17.4 6.2 20.8 5.2 22.8 8.6 C24.8 12.2 21.5 16 16 16 Z" transform="rotate(240 16 16)"/>

        <span>Xoá hết tiền và nhật ký hũ này?</span>
        <button class="mini danger" id="resetYes" type="button">Xoá</button>
        <button class="mini" id="resetNo" type="button">Huỷ</button>

      <div class="chart" id="chart">
        <div class="months" id="monthBars" aria-hidden="true"></div>
        <p class="chart-cap" id="monthTotal"></p>
      </div>

        <p id="streak"></p>
        <p id="pace"></p>
        <p id="need" hidden></p>

      <table id="logTable">
        <thead>
          <tr>
            <th scope="col">Ngày</th>
            <th scope="col">Đã thả</th>
            <th scope="col"><span class="sr">Sửa hoặc xoá</span></th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
      <p class="log-empty" id="logEmpty" hidden>Chưa có lần thả tiền nào. Thả đồng đầu tiên nhé!</p>
    </div>
  </section>
</main>

<script>
  const DEFAULTS = { main: 8415000, tet: 40000000 }; // mục tiêu gốc, sửa được trong app
  const TET = new Date(2027, 1, 6); // Tết Đinh Mùi
  const FILL_TOP = 62, FILL_BOTTOM = 326;
  const KEYS = { main: 'hu-tien-v1', tet: 'hu-tien-tet-2027' };
  const DAY = 86400000;
  const $ = id => document.getElementById(id);

  const dateKey = t => {
    const d = new Date(t);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  // đếm theo ngày lịch, không phải 24 giờ
  const dayNo = (from, to) => Math.max(1, Math.floor((startOfDay(to) - startOfDay(from)) / DAY) + 1);
  const daysToTet = () => Math.max(0, Math.ceil((startOfDay(TET) - startOfDay(Date.now())) / DAY));
  const fmt = n => n.toLocaleString('vi-VN');

  let active = 'main';
  let editingDate = null, deletingDate = null;
  const jars = {
    main: { saved: 0, goal: DEFAULTS.main, log: [], startedAt: 0, doneAt: 0 },
    tet: { saved: 0, goal: DEFAULTS.tet, log: [], startedAt: 0, doneAt: 0 }
  };

  const store = id => {
    try { localStorage.setItem(KEYS[id], JSON.stringify(jars[id])); } catch (e) {}
  };

  function loadJar(id, d) {
    const j = jars[id];
    j.saved = Math.max(0, Math.round(Number(d.saved) || 0));
    j.goal = Math.max(1, Math.round(Number(d.goal) || DEFAULTS[id]));
    j.startedAt = Number(d.startedAt) || Date.now();
    j.doneAt = Number(d.doneAt) || 0;
    j.log = Array.isArray(d.log)
      ? d.log.filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Number(e.amount) > 0)
             .map(e => ({ date: e.date, amount: Math.round(Number(e.amount)), opening: !!e.opening }))
      : [];
    // dữ liệu cũ chưa có nhật ký: ghi số dư hiện tại vào ngày bắt đầu
    if (!j.log.length && j.saved > 0) j.log.push({ date: dateKey(j.startedAt), amount: j.saved, opening: true });
  }

  for (const id in jars) {
    let d = {};
    try { d = JSON.parse(localStorage.getItem(KEYS[id]) || '{}') || {}; } catch (e) {}
    loadJar(id, d);
    store(id);
  }

  function render() {
    const j = jars[active];
    const tet = active === 'tet';
    const p = Math.min(1, j.saved / j.goal);
    const done = j.saved >= j.goal;
    if (done && !j.doneAt) { j.doneAt = Date.now(); store(active); }
    if (!done && j.doneAt) { j.doneAt = 0; store(active); }

    $('money').style.transform = `translateY(${(FILL_BOTTOM - p * (FILL_BOTTOM - FILL_TOP)).toFixed(2)}px)`;
    $('coins').style.opacity = p > 0.005 ? 1 : 0;
    $('savedText').textContent = fmt(j.saved);
    $('pct').textContent = Math.round(p * 100) + '% đầy hũ';
    $('daypill').textContent = tet
      ? (Date.now() >= TET ? 'Tết đã đến' : `Còn ${daysToTet()} ngày`)
      : (done ? `Hoàn thành · ${dayNo(j.startedAt, j.doneAt)} ngày` : `Ngày thứ ${dayNo(j.startedAt, Date.now())}`);
    $('daypill').title = tet
      ? 'Tết Đinh Mùi 2027'
      : 'Bắt đầu ' + new Date(j.startedAt).toLocaleDateString('vi-VN');
    $('card').classList.toggle('done', done);
    $('addForm').hidden = done;
    $('date').max = dateKey(Date.now());
    $('quick').hidden = done;
    $('dateRow').hidden = done;
    $('undo').disabled = !j.log.length;
    $('goalLabel').textContent = fmt(j.goal);
    $('status').innerHTML = done
      ? (tet ? 'Hũ đầy rồi! <b>Sẵn sàng đón Tết</b> 🧧' : 'Hũ đầy rồi! <b>Hoàn thành mục tiêu</b> 🎉')
      : (tet ? `Còn <b>${fmt(j.goal - j.saved)} ₫</b> nữa · Tết <b>06/02/2027</b>`
             : `Còn <b>${fmt(j.goal - j.saved)} ₫</b> nữa là đầy hũ`);
    renderLog();
  }

  function renderLog() {
    const j = jars[active];
    const tet = active === 'tet';
    const todayKey = dateKey(Date.now());
    const sums = new Map(), openOnly = new Map();
    for (const e of j.log) {
      sums.set(e.date, (sums.get(e.date) || 0) + e.amount);
      openOnly.set(e.date, (openOnly.get(e.date) ?? true) && !!e.opening);
    }
    const days = [...sums].sort((a, b) => a[0] < b[0] ? 1 : -1);
    const today = sums.get(todayKey) || 0;

    $('logTitle').innerHTML = 'Nhật ký thả tiền · <span>' + (tet ? 'Hũ Tết 2027' : 'Hũ tiết kiệm') + '</span>';
    $('todaySum').innerHTML = today ? `Hôm nay đã thả <b>${fmt(today)} ₫</b>` : 'Hôm nay chưa thả đồng nào';

    // chuỗi ngày liên tiếp
    let streak = 0;
    const cursor = new Date(startOfDay(Date.now()));
    if (!sums.has(todayKey)) cursor.setDate(cursor.getDate() - 1); // hôm nay chưa thả thì tính tới hôm qua
    while (sums.has(dateKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
    $('streak').innerHTML = streak
      ? `🔥 Chuỗi <b>${streak}</b> ngày liên tiếp`
      : '🌱 Thả tiền hôm nay để bắt đầu chuỗi';

    // 6 tháng gần nhất
    const now = new Date();
    const marks = [];
    for (let i = 5; i >= 0; i--) {
      const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
      marks.push({ key: m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0'), label: 'T' + (m.getMonth() + 1), value: 0 });
    }
    for (const e of j.log) for (const m of marks) if (e.date.startsWith(m.key)) m.value += e.amount;
    const max = Math.max(1, ...marks.map(m => m.value));
    $('monthBars').innerHTML = marks.map(m =>
      `<div class="bar" title="${m.label}: ${fmt(m.value)} ₫"><div class="track"><i style="height:${m.value ? Math.max(3, Math.round(m.value / max * 38)) : 0}px"></i></div><span>${m.label}</span></div>`
    ).join('');
    const cur = marks[marks.length - 1];
    $('monthTotal').innerHTML = `Tháng ${Number(cur.key.slice(5))}: <b>${fmt(cur.value)} ₫</b>`;

    // dự báo tốc độ
    const left = Math.max(0, j.goal - j.saved);
    const elapsed = dayNo(j.startedAt, Date.now());
    const perDay = j.saved / elapsed;
    if (!left) {
      $('pace').innerHTML = 'Hũ đã đầy — không cần góp thêm 🎉';
    } else if (!j.saved) {
      $('pace').innerHTML = 'Chưa có dữ liệu để dự báo tốc độ.';
    } else {
      const need = Math.max(1, Math.ceil(left / perDay));
      const when = new Date(startOfDay(Date.now()) + need * DAY).toLocaleDateString('vi-VN');
      $('pace').innerHTML = `Tốc độ ~<b>${fmt(Math.round(perDay))} ₫/ngày</b> · còn ~<b>${need}</b> ngày (khoảng ${when})`;
    }

    // hũ Tết: cần bao nhiêu mỗi ngày để kịp
    const dLeft = daysToTet();
    $('need').hidden = !tet || !left;
    if (tet && left) {
      $('need').innerHTML = dLeft > 0
        ? `Để kịp Tết: <b>${fmt(Math.ceil(left / dLeft))} ₫/ngày</b> trong ${dLeft} ngày`
        : 'Tết đã đến — không còn ngày để góp thêm.';
    }

    // bảng
    $('logTable').hidden = !days.length;
    $('logEmpty').hidden = days.length > 0;
    $('chart').hidden = !days.length;
    $('insights').classList.toggle('solo', !days.length);
    let html = '', month = '';
    for (const [key, amount] of days) {
      const [y, m, d] = key.split('-');
      const mo = m + '/' + y;
      if (mo !== month) {
        month = mo;
        html += `<tr class="month-row"><td colspan="3">Tháng ${m} · ${y}</td></tr>`;
      }
      const wd = openOnly.get(key)
        ? 'Số dư ban đầu'
        : new Date(+y, +m - 1, +d).toLocaleDateString('vi-VN', { weekday: 'long' });
      const isToday = key === todayKey;
      const label = `<span class="d-day">${d}/${m}</span><span class="d-wd">${wd}</span>` +
        (isToday ? '<span class="d-chip">Hôm nay</span>' : '');

      if (editingDate === key) {
        html += '<tr class="edit-row">' +
          `<td>${label}</td>` +
          `<td class="amt"><input class="row-input" id="rowInput" inputmode="numeric" maxlength="15" value="${fmt(amount)}" aria-label="Số tiền ngày ${d}/${m}/${y}"></td>` +
          `<td class="row-actions"><button type="button" class="mini primary" data-act="save" data-date="${key}">Lưu</button>` +
          `<button type="button" class="mini" data-act="cancel" data-date="${key}">Huỷ</button></td></tr>`;
      } else if (deletingDate === key) {
        html += '<tr class="del-row">' +
          `<td>${label}</td>` +
          `<td class="amt del-warn">Xoá ${fmt(amount)} ₫?</td>` +
          `<td class="row-actions"><button type="button" class="mini danger" data-act="delyes" data-date="${key}">Xoá</button>` +
          `<button type="button" class="mini" data-act="cancel" data-date="${key}">Huỷ</button></td></tr>`;
      } else {
        html += `<tr${isToday ? ' class="today"' : ''}>` +
          `<td>${label}</td>` +
          `<td class="amt">+${fmt(amount)} ₫</td>` +
          `<td class="row-actions"><button type="button" class="mini" data-act="edit" data-date="${key}" aria-label="Sửa số tiền ngày ${d}/${m}/${y}">Sửa</button>` +
          `<button type="button" class="mini danger" data-act="del" data-date="${key}" aria-label="Xoá ngày ${d}/${m}/${y}">Xoá</button></td></tr>`;
      }
    }
    $('logBody').innerHTML = html;
  }

  function dropCoin(v) {
    const el = document.createElement('div');
    el.className = 'coin-drop';
    el.textContent = '+' + fmt(v);
    $('stage').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.jar === active) return;
      active = btn.dataset.jar;
      document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      $('amount').value = '';
      resetRowState();
      showReset(false);
      closeGoal();
      render();
    });
  });

  document.querySelectorAll('#quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      $('amount').value = fmt(Number(btn.dataset.v));
      $('amount').focus();
    });
  });

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('amount');
    const v = Number(input.value.replace(/\D/g, ''));
    if (!v) {
      input.classList.remove('bad');
      void input.offsetWidth;
      input.classList.add('bad');
      input.focus();
      return;
    }
    const j = jars[active];
    const add = Math.min(v, j.goal - j.saved);
    if (add <= 0) return;
    // cho ghi bù ngày cũ, không cho ngày tương lai
    const picked = $('date').value;
    const todayKey = dateKey(Date.now());
    const date = /^\d{4}-\d{2}-\d{2}$/.test(picked) && picked <= todayKey ? picked : todayKey;
    j.saved += add;
    j.log.push({ date, amount: add });
    input.value = '';
    $('date').value = todayKey;
    input.classList.remove('bad');
    store(active);
    render();
    dropCoin(add);
  });

  $('undo').addEventListener('click', () => {
    const j = jars[active];
    const entry = j.log.pop();
    if (!entry) return;
    j.saved = Math.max(0, j.saved - entry.amount);
    store(active);
    render();
  });

  $('reset').addEventListener('click', () => {
    resetRowState();
    showReset(true);
  });

  $('resetNo').addEventListener('click', () => showReset(false));

  $('resetYes').addEventListener('click', () => {
    const j = jars[active];
    const tet = active === 'tet';
    j.saved = 0;
    j.log = [];
    j.doneAt = 0;
    if (!tet) j.startedAt = Date.now(); // hũ Tết đếm theo lịch, không đặt lại
    resetRowState();
    showReset(false);
    store(active);
    render();
  });

  // sửa mục tiêu
  $('editGoal').addEventListener('click', () => {
    $('goalPick').hidden = true;
    $('goalEdit').hidden = false;
    const input = $('goalInput');
    input.value = fmt(jars[active].goal);
    input.focus();
    input.select();
  });
  const closeGoal = () => {
    const wasOpen = !$('goalEdit').hidden;
    $('goalEdit').hidden = true;
    $('goalPick').hidden = false;
    if (wasOpen) $('editGoal').focus();
  };
  $('goalSave').addEventListener('click', () => {
    const v = Number($('goalInput').value.replace(/\D/g, ''));
    if (!v) { $('goalInput').focus(); return; }
    jars[active].goal = v;
    store(active);
    closeGoal();
    render();
  });
  $('goalCancel').addEventListener('click', closeGoal);
  $('goalInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('goalSave').click(); }
    if (e.key === 'Escape') closeGoal();
  });

  // sửa / xoá một ngày trong nhật ký — inline, không dùng hộp thoại trình duyệt
  const resetRowState = () => { editingDate = null; deletingDate = null; };
  const showReset = on => { $('resetConfirm').hidden = !on; $('actions').hidden = on; };
  const dayTotal = (j, date) => j.log.filter(x => x.date === date).reduce((s, x) => s + x.amount, 0);

  $('logBody').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    const date = btn.dataset.date;
    const j = jars[active];

    if (act === 'edit') {
      editingDate = date;
      deletingDate = null;
      renderLog();
      const input = $('rowInput');
      if (input) { input.focus(); input.select(); }
    } else if (act === 'del') {
      deletingDate = date;
      editingDate = null;
      renderLog();
    } else if (act === 'cancel') {
      resetRowState();
      renderLog();
      const back = document.querySelector(`#logBody button[data-act="edit"][data-date="${date}"]`);
      if (back) back.focus();
    } else if (act === 'save') {
      const input = $('rowInput');
      const v = Number((input.value || '').replace(/\D/g, ''));
      if (!v) {
        input.classList.remove('bad');
        void input.offsetWidth;
        input.classList.add('bad');
        input.focus();
        return;
      }
      j.saved = Math.max(0, j.saved - dayTotal(j, date) + v);
      j.log = j.log.filter(x => x.date !== date).concat({ date, amount: v });
      resetRowState();
      store(active);
      render();
      const back = document.querySelector(`#logBody button[data-act="edit"][data-date="${date}"]`);
      if (back) back.focus();
    } else if (act === 'delyes') {
      j.saved = Math.max(0, j.saved - dayTotal(j, date));
      j.log = j.log.filter(x => x.date !== date);
      resetRowState();
      store(active);
      render();
    }
  });

  $('logBody').addEventListener('keydown', e => {
    if (!e.target.classList.contains('row-input')) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      const save = document.querySelector('#logBody button[data-act="save"]');
      if (save) save.click();
    } else if (e.key === 'Escape') {
      const date = editingDate;
      resetRowState();
      renderLog();
      const back = date && document.querySelector(`#logBody button[data-act="edit"][data-date="${date}"]`);
      if (back) back.focus();
    }
  });

  // sao lưu / nhập file
  $('importBtn').addEventListener('click', () => $('importFile').click());

  $('backup').addEventListener('click', () => {
    const data = {
      app: 'hu-tien', version: 1, exportedAt: new Date().toISOString(),
      jars: { main: jars.main, tet: jars.tet }
    };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = 'hu-tien-' + dateKey(Date.now()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('importFile').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(String(reader.result)); } catch (err) { alert('File không hợp lệ.'); return; }
      const src = data && data.jars ? data.jars : data;
      if (!src || typeof src !== 'object' || (!src.main && !src.tet)) { alert('File không đúng định dạng sao lưu.'); return; }
      if (!confirm('Nhập file sẽ thay thế dữ liệu 2 hũ hiện tại. Tiếp tục?')) return;
      for (const id in jars) if (src[id] && typeof src[id] === 'object') { loadJar(id, src[id]); store(id); }
      $('date').value = dateKey(Date.now());
      render();
    };
    reader.readAsText(file);
  });

  $('date').max = dateKey(Date.now());
  $('date').value = dateKey(Date.now());
  render();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</script>
</body>
</html>
